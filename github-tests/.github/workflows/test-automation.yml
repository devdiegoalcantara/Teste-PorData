name: Test Automation Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  cypress-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          record: false
        env:
          GITHUB_EMAIL: ${{ secrets.GITHUB_EMAIL }}
          GITHUB_PASSWORD: ${{ secrets.GITHUB_PASSWORD }}
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos

  k6-performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Run K6 Login Performance Test
        run: k6 run --out json=k6-results/login-results.json k6-tests/login-performance.test.js
        continue-on-error: true

      - name: Run K6 Repositories Performance Test
        run: k6 run --out json=k6-results/repos-results.json k6-tests/repositories-performance.test.js
        continue-on-error: true

      - name: Run K6 Logout Performance Test
        run: k6 run --out json=k6-results/logout-results.json k6-tests/logout-performance.test.js
        continue-on-error: true

      - name: Upload K6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-performance-results
          path: k6-results/
